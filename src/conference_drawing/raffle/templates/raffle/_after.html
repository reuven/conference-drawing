{# The one |safe in the app: after.html is produced by raffle/markup.py::render_markdown, which escapes all raw HTML and allows only a fixed set of tags and https links, so it is already sanitized. #}
{% if after.logo_url %}<img class="after-logo" src="{{ after.logo_url }}" alt="{{ install.owner_name }}">{% endif %}
{% if after.html %}<div class="after-content">{{ after.html|safe }}</div>{% endif %}
