name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Tag postgres:18, pinned by digest (the multi-arch index, looked up
        # 2026-11-22) like the actions below. To move it, run
        # `docker buildx imagetools inspect postgres:18` and paste the new digest.
        # Dependabot does not bump service-container images, so this digest
        # only moves when someone refreshes it by hand with that command.
        image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "1"
      # django-stubs imports the settings module, which requires a key.
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      # The service container above; pytest-django creates test_conference_drawing.
      CD_DB_HOST: localhost
      CD_DB_PORT: "5432"
      CD_DB_USER: postgres
      CD_DB_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest --cov=conference_drawing -m "not e2e"
      - name: End-to-end tests
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest -m e2e
