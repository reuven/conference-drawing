[project]
name = "conference-drawing"
version = "0.1.0"
description = "Self-hosted Django app for running book raffles at a conference booth"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Reuven Lerner", email = "reuven@lerner.co.il" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.1.3",
    "django-ratelimit>=4.1.0",
    "django-stubs-ext>=6.1.2",
    "gunicorn>=27.0.1",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic[email]>=2.14.4",
    "python-dotenv>=1.2.4",
    "segno>=1.6.6",
    "whitenoise>=6.12.0",
]

[project.scripts]
conference-drawing = "conference_drawing.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "hypothesis>=6.170.17",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.7",
    "pytest-playwright>=0.10.0",
    "pytest-testmon>=2.3.1",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "conference_drawing.settings"
# Plain `pytest` skips the browser tests (they need a heavy test slot); a
# command-line -m (CI: -m e2e, -m "not e2e") replaces this one.
addopts = "--strict-markers --timeout=60 -m \"not e2e\""
testpaths = ["tests"]
# The local PostgreSQL (Homebrew on the laptop: socket in /tmp, peer auth as
# the login user). D: leaves a value CI already set alone.
env = [
    "DJANGO_SECRET_KEY=test-only-secret-key-not-for-production",
    "D:CD_DB_HOST=/tmp",
    "D:CD_DB_USER={USER}",
]
filterwarnings = ["ignore:No directory at:UserWarning"]
markers = ["e2e: browser end-to-end tests (run on dispatch and release tags)"]

[tool.coverage.run]
source = ["conference_drawing"]
branch = true
omit = ["*/migrations/*", "*/wsgi.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["django_ratelimit", "django_ratelimit.*"]
ignore_missing_imports = true  # no stubs or py.typed

[tool.django-stubs]
django_settings_module = "conference_drawing.settings"

[tool.ruff]
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # seeded random.Random makes draws reproducible

[tool.mutmut]
source_paths = ["src/conference_drawing"]
# The pure-logic modules whose tests are worth auditing; the rest is Django glue.
only_mutate = [
    "*/raffle/eligibility.py",
    "*/raffle/draw.py",
    "*/raffle/codes.py",
    "*/raffle/text.py",
]
# mutants/ gets a copy of pyproject.toml, so pytest's env (the Postgres test
# database settings) applies there too. e2e needs a browser, and tests/deploy
# needs deploy/, which is not copied; neither exercises the mutated modules.
pytest_add_cli_args = ["-m", "not e2e", "--ignore=tests/deploy"]
